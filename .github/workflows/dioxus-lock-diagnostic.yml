name: dioxus-lock-diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dioxus-lock-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DIOXUS_REF: 3e43ffa6cf1488d5388c888eb5f2494a006ae6de

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out exact Dioxus 0.7.9 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DioxusLabs/dioxus
          ref: ${{ env.DIOXUS_REF }}
          path: subject/dioxus
          persist-credentials: false

      - name: Install exact Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          mkdir -p .dioxus-lock-evidence
          rustc +1.94.0 --version | tee .dioxus-lock-evidence/rustc.txt
          cargo +1.94.0 --version | tee .dioxus-lock-evidence/cargo.txt

      - name: Record tagged lock and harness stanza
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject/dioxus rev-parse HEAD)" = "$DIOXUS_REF"
          cp subject/dioxus/Cargo.lock .dioxus-lock-evidence/upstream-Cargo.lock
          sha256sum subject/dioxus/Cargo.lock > .dioxus-lock-evidence/upstream-Cargo.lock.sha256
          grep -n -A40 -B4 '^name = "wasm-split-harness"$' subject/dioxus/Cargo.lock \
            > .dioxus-lock-evidence/upstream-harness-stanza.txt
          test -s .dioxus-lock-evidence/upstream-harness-stanza.txt

      - name: Reproduce the locked failure without mutating source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo +1.94.0 metadata --locked --format-version=1 \
            --manifest-path subject/dioxus/Cargo.toml \
            > .dioxus-lock-evidence/locked-metadata.json \
            2> .dioxus-lock-evidence/locked-metadata.stderr
          status=$?
          set -e
          printf '%s\n' "$status" > .dioxus-lock-evidence/locked-metadata.exit
          test "$status" -ne 0
          test -z "$(git -C subject/dioxus status --porcelain --untracked-files=no)"

      - name: Let Cargo 1.94 resolve only the tagged workspace lock delta
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 metadata --format-version=1 \
            --manifest-path subject/dioxus/Cargo.toml \
            > .dioxus-lock-evidence/derived-metadata.json \
            2> .dioxus-lock-evidence/derived-metadata.stderr
          changes="$(git -C subject/dioxus status --porcelain --untracked-files=no)"
          printf '%s\n' "$changes" > .dioxus-lock-evidence/working-tree.txt
          test "$changes" = ' M Cargo.lock'
          git -C subject/dioxus diff -- Cargo.lock > .dioxus-lock-evidence/Cargo.lock.diff
          test -s .dioxus-lock-evidence/Cargo.lock.diff
          cp subject/dioxus/Cargo.lock .dioxus-lock-evidence/derived-Cargo.lock
          sha256sum subject/dioxus/Cargo.lock > .dioxus-lock-evidence/derived-Cargo.lock.sha256
          grep -n -A40 -B4 '^name = "wasm-split-harness"$' subject/dioxus/Cargo.lock \
            > .dioxus-lock-evidence/derived-harness-stanza.txt
          printf 'added_lines=%s\nremoved_lines=%s\n' \
            "$(grep -c '^+' .dioxus-lock-evidence/Cargo.lock.diff || true)" \
            "$(grep -c '^-' .dioxus-lock-evidence/Cargo.lock.diff || true)" \
            > .dioxus-lock-evidence/diff-stats.txt

      - name: Prove the derived lock is frozen and buildable
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 metadata --locked --format-version=1 \
            --manifest-path subject/dioxus/Cargo.toml \
            > .dioxus-lock-evidence/locked-derived-metadata.json
          before="$(sha256sum subject/dioxus/Cargo.lock | awk '{print $1}')"
          cargo +1.94.0 rustc --locked \
            --manifest-path subject/dioxus/Cargo.toml \
            --package wasm-split-harness \
            --target wasm32-unknown-unknown \
            --profile wasm-split-release \
            -- -Clink-args=--emit-relocs \
            2>&1 | tee .dioxus-lock-evidence/harness-build.log
          after="$(sha256sum subject/dioxus/Cargo.lock | awk '{print $1}')"
          test "$before" = "$after"
          test -s subject/dioxus/target/wasm32-unknown-unknown/wasm-split-release/wasm-split-harness.wasm
          sha256sum subject/dioxus/target/wasm32-unknown-unknown/wasm-split-release/wasm-split-harness.wasm \
            > .dioxus-lock-evidence/harness.wasm.sha256

      - name: Preserve lock diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dioxus-lock-diagnostic-${{ github.sha }}
          path: .dioxus-lock-evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
