name: contract-ir-admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OWLS_INTERFACES_REF: 1c3b29f1c43f9f38f637106e3ff601620df4a572
  TSJSV_REF: 6bb5b7c1ee41c8b43741e50a264c33a1165549c4

jobs:
  external-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out external consumer suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out exact admitted WASM interface source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: subject/owls-interfaces
          persist-credentials: false

      - name: Check out exact Contract IR producer and verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TSJSV_REF }}
          path: subject/typespec-json-schema-validator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the producer's lockfile-pinned dependencies
        working-directory: subject/typespec-json-schema-validator
        run: npm ci --omit=dev

      - name: Record exact source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .contract-ir-evidence
          for ref in "$OWLS_INTERFACES_REF" "$TSJSV_REF"; do
            test "${#ref}" -eq 40
            case "$ref" in *[!0-9a-f]*) exit 1 ;; esac
          done
          test "$(git -C subject/owls-interfaces rev-parse HEAD)" = "$OWLS_INTERFACES_REF"
          test "$(git -C subject/typespec-json-schema-validator rev-parse HEAD)" = "$TSJSV_REF"
          {
            printf 'consumer=%s\n' "$(git rev-parse HEAD)"
            printf 'owls_interfaces=%s\n' "$(git -C subject/owls-interfaces rev-parse HEAD)"
            printf 'validator=%s\n' "$(git -C subject/typespec-json-schema-validator rev-parse HEAD)"
            printf 'node=%s\n' "$(node --version)"
          } > .contract-ir-evidence/versions.txt

      - name: Emit parity receipt, Schema B, and Contract IR
        shell: bash
        run: |
          set -euo pipefail
          node subject/typespec-json-schema-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=subject/owls-interfaces/contracts/main.tsp \
            --schema=subject/owls-interfaces/schemas/release.schema.json \
            --report=.contract-ir-evidence/report.json \
            --contract-ir=.contract-ir-evidence/contract-ir.json \
            --output-dir=.contract-ir-evidence/generated \
            --max-probes=96 \
            --quiet=true

      - name: Re-verify the exact IR and five-language projection receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subject/owls-interfaces/.tools
          ln -s ../../typespec-json-schema-validator \
            subject/owls-interfaces/.tools/typespec-json-schema-validator
          mkdir -p subject/owls-interfaces/.typespec-json-schema-validator
          cp .contract-ir-evidence/report.json \
            subject/owls-interfaces/.typespec-json-schema-validator/report.json
          cp .contract-ir-evidence/contract-ir.json \
            subject/owls-interfaces/.typespec-json-schema-validator/contract-ir.json
          cp -R .contract-ir-evidence/generated \
            subject/owls-interfaces/.typespec-json-schema-validator/generated
          (cd subject/owls-interfaces && node scripts/verify-contract-ir.mjs)
          (cd subject/owls-interfaces && node scripts/check-language-projections.mjs)
          cp subject/owls-interfaces/.typespec-json-schema-validator/projection-receipt.json \
            .contract-ir-evidence/projection-receipt.json

      - name: Run adversarial downstream admission tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap contract-ir/admission.test.mjs \
            | tee .contract-ir-evidence/admission.tap

      - name: Seal evidence digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .contract-ir-evidence/report.json \
            .contract-ir-evidence/contract-ir.json \
            .contract-ir-evidence/projection-receipt.json \
            .contract-ir-evidence/verification.json \
            .contract-ir-evidence/admission.tap \
            > .contract-ir-evidence/sha256.txt
          tar -czf .contract-ir-evidence/source.tar.gz \
            contract-ir/admission.test.mjs \
            .github/workflows/contract-ir-admission.yml \
            subject/owls-interfaces/contracts/main.tsp \
            subject/owls-interfaces/schemas/release.schema.json \
            subject/typespec-json-schema-validator/src/contract-ir.mjs \
            subject/typespec-json-schema-validator/src/contract-ir-file.mjs \
            subject/typespec-json-schema-validator/schema/contract-ir.schema.json
          sha256sum .contract-ir-evidence/source.tar.gz \
            >> .contract-ir-evidence/sha256.txt

      - name: Preserve consumer-side evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-ir-admission-${{ github.sha }}
          path: .contract-ir-evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
