name: contract-ir-admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-ir-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OWLS_INTERFACES_REF: cfe0b18fe9ae361d94ea0646627cb732465b5496
  TSJSV_REF: 03ccc0ecdfc70f9198c3ccf80718910961d3fde1
  OWLS_WEB_LOADER_REF: d9f7624c80b606e8be5479f9e2dea89ac9e35284
  OWLS_RUNTIME_REF: 1cbd6107b26e85420b924afa9cae1d401e223802
  OWLS_FLUTTER_REF: 8f6bda35d8efb21b817295b01e4b0c58a59910cd

jobs:
  external-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out external consumer suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out exact admitted WASM interface source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: subject/owls-interfaces
          persist-credentials: false

      - name: Check out exact Contract IR producer and verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TSJSV_REF }}
          path: subject/typespec-json-schema-validator
          persist-credentials: false

      - name: Check out exact browser loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-web-loader
          ref: ${{ env.OWLS_WEB_LOADER_REF }}
          path: subject/owls-web-loader
          persist-credentials: false

      - name: Check out exact native Rust loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-runtime.rs
          ref: ${{ env.OWLS_RUNTIME_REF }}
          path: subject/owls-runtime
          persist-credentials: false

      - name: Check out exact Flutter loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-flutter
          ref: ${{ env.OWLS_FLUTTER_REF }}
          path: subject/owls-flutter
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install the producer's lockfile-pinned dependencies
        working-directory: subject/typespec-json-schema-validator
        run: npm ci --omit=dev

      - name: Record exact five-host source closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .contract-ir-evidence
          for ref in \
            "$OWLS_INTERFACES_REF" \
            "$TSJSV_REF" \
            "$OWLS_WEB_LOADER_REF" \
            "$OWLS_RUNTIME_REF" \
            "$OWLS_FLUTTER_REF"; do
            test "${#ref}" -eq 40
            case "$ref" in *[!0-9a-f]*) exit 1 ;; esac
          done
          test "$(git -C subject/owls-interfaces rev-parse HEAD)" = "$OWLS_INTERFACES_REF"
          test "$(git -C subject/typespec-json-schema-validator rev-parse HEAD)" = "$TSJSV_REF"
          test "$(git -C subject/owls-web-loader rev-parse HEAD)" = "$OWLS_WEB_LOADER_REF"
          test "$(git -C subject/owls-runtime rev-parse HEAD)" = "$OWLS_RUNTIME_REF"
          test "$(git -C subject/owls-flutter rev-parse HEAD)" = "$OWLS_FLUTTER_REF"
          {
            printf 'consumer=%s\n' "$(git rev-parse HEAD)"
            printf 'owls_interfaces=%s\n' "$OWLS_INTERFACES_REF"
            printf 'validator=%s\n' "$TSJSV_REF"
            printf 'web_loader=%s\n' "$OWLS_WEB_LOADER_REF"
            printf 'native_loader=%s\n' "$OWLS_RUNTIME_REF"
            printf 'flutter_loader=%s\n' "$OWLS_FLUTTER_REF"
            printf 'node=%s\n' "$(node --version)"
          } > .contract-ir-evidence/versions.txt

      - name: Prove every OWLS host enforces the same TJSV contract closure
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap contract-ir/source-closure.test.mjs \
            | tee .contract-ir-evidence/source-closure.tap

      - name: Stage admitted interface fixtures as independent TJSV corpus
        shell: bash
        run: |
          set -euo pipefail
          corpus=.contract-ir-evidence/instances/Release/valid
          mkdir -p "$corpus"
          cp subject/owls-interfaces/fixtures/valid/*.json "$corpus"/
          count="$(find "$corpus" -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$count" -ge 4

      - name: Emit parity receipt, Schema B, and Contract IR
        shell: bash
        run: |
          set -euo pipefail
          node subject/typespec-json-schema-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=subject/owls-interfaces/contracts/main.tsp \
            --schema=subject/owls-interfaces/schemas/release.schema.json \
            --instances=.contract-ir-evidence/instances \
            --report=.contract-ir-evidence/report.json \
            --contract-ir=.contract-ir-evidence/contract-ir.json \
            --output-dir=.contract-ir-evidence/generated \
            --max-probes=96 \
            --quiet=true

      - name: Canonically verify complete downstream Contract IR scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@03ccc0ecdfc70f9198c3ccf80718910961d3fde1
        with:
          contract_ir: .contract-ir-evidence/contract-ir.json
          report: .contract-ir-evidence/report.json
          typespec: subject/owls-interfaces/contracts/main.tsp
          schema: subject/owls-interfaces/schemas/release.schema.json
          generated_schema: .contract-ir-evidence/generated/typespec.generated.schema.json
          expected_declarations: >-
            [
              "Ores.WasmLoaders.Activation",
              "Ores.WasmLoaders.ActivationMode",
              "Ores.WasmLoaders.ApplicationId",
              "Ores.WasmLoaders.Asset",
              "Ores.WasmLoaders.AssetId",
              "Ores.WasmLoaders.AssetKind",
              "Ores.WasmLoaders.AssetRole",
              "Ores.WasmLoaders.AssetStage",
              "Ores.WasmLoaders.EntrypointId",
              "Ores.WasmLoaders.FrameworkKind",
              "Ores.WasmLoaders.HostSelector",
              "Ores.WasmLoaders.HttpsAssetUrl",
              "Ores.WasmLoaders.IslandName",
              "Ores.WasmLoaders.PrepareBudget",
              "Ores.WasmLoaders.PrepareStage",
              "Ores.WasmLoaders.RecordString",
              "Ores.WasmLoaders.RecordUnknown",
              "Ores.WasmLoaders.Release",
              "Ores.WasmLoaders.ReleaseId",
              "Ores.WasmLoaders.RuntimeKind",
              "Ores.WasmLoaders.SchemaVersion",
              "Ores.WasmLoaders.Sha256Hex",
              "Ores.WasmLoaders.ToolchainId"
            ]
          verification: .contract-ir-evidence/tjsv-consumer-verification.json

      - name: Run adversarial downstream admission tests
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            contract-ir/admission.test.mjs \
            contract-ir/workflow-policy.test.mjs \
            | tee .contract-ir-evidence/admission.tap

      - name: Seal evidence digests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            .contract-ir-evidence/report.json \
            .contract-ir-evidence/contract-ir.json \
            .contract-ir-evidence/tjsv-consumer-verification.json \
            .contract-ir-evidence/verification.json \
            .contract-ir-evidence/source-closure.tap \
            .contract-ir-evidence/admission.tap \
            contract-ir/source-closure.json \
            > .contract-ir-evidence/sha256.txt
          tar -czf .contract-ir-evidence/source.tar.gz \
            contract-ir/admission.test.mjs \
            contract-ir/workflow-policy.test.mjs \
            contract-ir/source-closure.json \
            contract-ir/source-closure.test.mjs \
            .github/workflows/contract-ir-admission.yml \
            subject/owls-interfaces/contracts/main.tsp \
            subject/owls-interfaces/schemas/release.schema.json \
            subject/owls-interfaces/.github/workflows/contract.yml \
            subject/owls-web-loader/.github/workflows/contract-ir-consumer.yml \
            subject/owls-runtime/.github/workflows/native-contract.yml \
            subject/owls-flutter/.github/workflows/flutter-package.yml \
            subject/typespec-json-schema-validator/src/contract-ir.mjs \
            subject/typespec-json-schema-validator/src/contract-ir-file.mjs \
            subject/typespec-json-schema-validator/schema/contract-ir.schema.json
          sha256sum .contract-ir-evidence/source.tar.gz \
            >> .contract-ir-evidence/sha256.txt

      - name: Preserve consumer-side evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-ir-admission-${{ github.sha }}
          path: .contract-ir-evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
