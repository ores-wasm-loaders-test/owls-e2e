name: marketing-manifest-ownership
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-manifest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OWLS_WEB_LOADER_REF: a4b642f44f863d6d83d7dc183b4e56945126dfdf
  OWLS_INTERFACES_REF: 76364a23364993ff4be1ed82a4978725ed6f811c
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      OWLS_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ores-wasm-loaders/owls-web-loader
          ref: ${{ env.OWLS_WEB_LOADER_REF }}
          path: package-src/owls-web-loader
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: package-src/owls-interfaces
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install the existing locked browser tooling
        run: |
          npm ci --ignore-scripts --prefix pilot/real
          cd pilot/real
          npx --no-install playwright install --with-deps "$OWLS_BROWSER"
      - name: Record exact source and browser test inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          { git rev-parse HEAD; git -C package-src/owls-web-loader rev-parse HEAD; git -C package-src/owls-interfaces rev-parse HEAD; node --version; } > evidence/versions.txt
          test "$(git -C package-src/owls-web-loader rev-parse HEAD)" = "$OWLS_WEB_LOADER_REF"
          test "$(git -C package-src/owls-interfaces rev-parse HEAD)" = "$OWLS_INTERFACES_REF"
          tar -czf evidence/source.tar.gz pilot/real/marketing-manifest.browser.test.mjs pilot/real/package.json pilot/real/package-lock.json .github/workflows/marketing-manifest-ownership.yml package-src/owls-web-loader/src package-src/owls-interfaces/index.mjs package-src/owls-interfaces/release.mjs package-src/owls-interfaces/validate.mjs package-src/owls-interfaces/schemas
          sha256sum evidence/source.tar.gz > evidence/source.sha256
      - name: Certify real HTTPS manifest ownership
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap pilot/real/marketing-manifest.browser.test.mjs | tee evidence/browser.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: manifest-ownership-${{ matrix.browser }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
