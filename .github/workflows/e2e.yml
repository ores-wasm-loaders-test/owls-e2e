name: e2e

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OWLS_INTERFACES_REF: b0e687c88b652d25964c041e2fdd0222f512fddd
  OWLS_WEB_LOADER_REF: e02e6b7867cd07b8640f86b017b332adadc4124a
  OWLS_RUNTIME_REF: 56de8a34998101b5c379d35b43122c67ae5c78f2
  OWLS_FLUTTER_REF: 962aef4350b3f9a40901f12acfefde6ab0473353
  TSJSV_REF: 3822508a667d36f9e094f84aa57b1b2944230852

jobs:
  materialize:
    name: exact source provenance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out external consumer suite
        uses: actions/checkout@v4
      - name: Check out owls-interfaces at the declared commit
        uses: actions/checkout@v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: zed_modules/ores-wasm-loaders/owls-interfaces
      - name: Check out owls-web-loader at the declared commit
        uses: actions/checkout@v4
        with:
          repository: ores-wasm-loaders/owls-web-loader
          ref: ${{ env.OWLS_WEB_LOADER_REF }}
          path: zed_modules/ores-wasm-loaders/owls-web-loader
      - name: Check out owls-runtime.rs at the declared commit
        uses: actions/checkout@v4
        with:
          repository: ores-wasm-loaders/owls-runtime.rs
          ref: ${{ env.OWLS_RUNTIME_REF }}
          path: zed_modules/ores-wasm-loaders/owls-runtime
      - name: Check out owls-flutter at the declared commit
        uses: actions/checkout@v4
        with:
          repository: ores-wasm-loaders/owls-flutter
          ref: ${{ env.OWLS_FLUTTER_REF }}
          path: zed_modules/ores-wasm-loaders/owls-flutter
      - name: Assert the exact external layout and record provenance
        run: |
          set -euo pipefail
          for path in \
            zed_modules/ores-wasm-loaders/owls-interfaces/contracts/main.tsp \
            zed_modules/ores-wasm-loaders/owls-interfaces/schemas/release.schema.json \
            zed_modules/ores-wasm-loaders/owls-web-loader/index.mjs \
            zed_modules/ores-wasm-loaders/owls-runtime/Cargo.toml \
            zed_modules/ores-wasm-loaders/owls-flutter/pubspec.yaml; do
            test -e "$path" || { echo "::error::missing source input: $path"; exit 1; }
          done
          find zed_modules -type d -name .git -prune -exec rm -rf {} +
          cat > zed_modules/owls-source-lock.json <<JSON
          {
            "schema": "ores-wasm-loaders-test.source-lock/v1",
            "interfaces": "$OWLS_INTERFACES_REF",
            "webLoader": "$OWLS_WEB_LOADER_REF",
            "runtime": "$OWLS_RUNTIME_REF",
            "flutter": "$OWLS_FLUTTER_REF"
          }
          JSON
      - uses: actions/upload-artifact@v4
        with:
          name: zed_modules
          path: zed_modules
          retention-days: 3
          include-hidden-files: true

  corpus:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "jsonschema==4.26.0"
      - name: Validate all corpus expectations against independent JSON Schema A
        run: python3 tools/validate_corpus.py

  parity:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - name: Check out the parity linter at an exact commit
        uses: actions/checkout@v4
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TSJSV_REF }}
          path: .tools/typespec-json-schema-validator
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: .tools/typespec-json-schema-validator
      - name: Generate JSON Schema B from TypeSpec and compare it with independent JSON Schema A
        run: |
          node .tools/typespec-json-schema-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=zed_modules/ores-wasm-loaders/owls-interfaces/contracts/main.tsp \
            --schema=zed_modules/ores-wasm-loaders/owls-interfaces/schemas/release.schema.json \
            --report=artifacts/typespec-json-schema-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typespec-json-schema-parity
          path: artifacts/typespec-json-schema-parity.json
          if-no-files-found: warn

  node:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Run the current API against all 54 corpus cases and lifecycle scenarios
        run: node --test node/current-api.test.mjs

  rust:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - name: Install the minimum edition-2024 Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal && rustup default 1.85.0
      - name: Compile and run the Rust external consumer
        run: cargo test --manifest-path rust/Cargo.toml

  dart:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve, analyze, and test the Dart/Flutter external consumer
        working-directory: dart
        run: |
          flutter pub get
          flutter analyze
          flutter test

  go:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: go/go.mod
      - name: Run the dependency-free Go contract and verified-preparation consumer
        working-directory: go
        run: go test ./...

  browser:
    needs: materialize
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: zed_modules, path: zed_modules }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install pinned Playwright and Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real browser hover-prefetch and activation smoke test
        run: node browser/current-api-smoke.mjs
