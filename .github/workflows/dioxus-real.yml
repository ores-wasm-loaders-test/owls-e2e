name: real-dioxus-route-split

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-dioxus-route-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DIOXUS_REF: 3e43ffa6cf1488d5388c888eb5f2494a006ae6de
  OWLS_INTERFACES_REF: cfe0b18fe9ae361d94ea0646627cb732465b5496
  OWLS_WEB_LOADER_REF: d9f7624c80b606e8be5479f9e2dea89ac9e35284
  TSJSV_REF: 03ccc0ecdfc70f9198c3ccf80718910961d3fde1

jobs:
  dioxus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out external acceptance suite
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check out exact admitted interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-interfaces
          ref: ${{ env.OWLS_INTERFACES_REF }}
          path: subject/owls-interfaces
          persist-credentials: false

      - name: Check out exact admitted browser loader
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ores-wasm-loaders/owls-web-loader
          ref: ${{ env.OWLS_WEB_LOADER_REF }}
          path: subject/owls-web-loader
          persist-credentials: false

      - name: Check out exact TJSV producer and verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ORESoftware/typespec-json-schema-validator
          ref: ${{ env.TSJSV_REF }}
          path: subject/typespec-json-schema-validator
          persist-credentials: false

      - name: Check out exact Dioxus 0.7.9 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: DioxusLabs/dioxus
          ref: ${{ env.DIOXUS_REF }}
          path: subject/dioxus
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify immutable source closure
        shell: bash
        run: |
          set -euo pipefail
          for ref in "$DIOXUS_REF" "$OWLS_INTERFACES_REF" "$OWLS_WEB_LOADER_REF" "$TSJSV_REF"; do
            test "${#ref}" -eq 40
            case "$ref" in *[!0-9a-f]*) exit 1 ;; esac
          done
          test "$(git -C subject/dioxus rev-parse HEAD)" = "$DIOXUS_REF"
          test "$(git -C subject/owls-interfaces rev-parse HEAD)" = "$OWLS_INTERFACES_REF"
          test "$(git -C subject/owls-web-loader rev-parse HEAD)" = "$OWLS_WEB_LOADER_REF"
          test "$(git -C subject/typespec-json-schema-validator rev-parse HEAD)" = "$TSJSV_REF"
          test -f subject/dioxus/Cargo.lock
          grep -q 'features = \["web", "router", "wasm-split"\]' subject/dioxus/packages/playwright-tests/wasm-split-harness/Cargo.toml
          grep -q '#\[route("/child")\]' subject/dioxus/packages/playwright-tests/wasm-split-harness/src/main.rs

      - name: Install TJSV dependencies from exact lockfile
        working-directory: subject/typespec-json-schema-validator
        run: npm ci --omit=dev

      - name: Re-admit peer authorities with the real consumer corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dioxus-evidence/instances/Release/valid .dioxus-evidence/tjsv
          cp subject/owls-interfaces/fixtures/valid/*.json .dioxus-evidence/instances/Release/valid/
          node subject/typespec-json-schema-validator/bin/typespec-json-schema-validator.mjs check \
            --typespec=subject/owls-interfaces/contracts/main.tsp \
            --schema=subject/owls-interfaces/schemas/release.schema.json \
            --instances=.dioxus-evidence/instances \
            --report=.dioxus-evidence/tjsv/report.json \
            --contract-ir=.dioxus-evidence/tjsv/contract-ir.json \
            --output-dir=.dioxus-evidence/tjsv/generated \
            --max-probes=96 \
            --quiet=true

      - name: Canonically verify current peer authorities and complete scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@03ccc0ecdfc70f9198c3ccf80718910961d3fde1
        with:
          contract_ir: .dioxus-evidence/tjsv/contract-ir.json
          report: .dioxus-evidence/tjsv/report.json
          typespec: subject/owls-interfaces/contracts/main.tsp
          schema: subject/owls-interfaces/schemas/release.schema.json
          generated_schema: .dioxus-evidence/tjsv/generated/typespec.generated.schema.json
          expected_declarations: >-
            [
              "Ores.WasmLoaders.Activation",
              "Ores.WasmLoaders.ActivationMode",
              "Ores.WasmLoaders.ApplicationId",
              "Ores.WasmLoaders.Asset",
              "Ores.WasmLoaders.AssetId",
              "Ores.WasmLoaders.AssetKind",
              "Ores.WasmLoaders.AssetRole",
              "Ores.WasmLoaders.AssetStage",
              "Ores.WasmLoaders.EntrypointId",
              "Ores.WasmLoaders.FrameworkKind",
              "Ores.WasmLoaders.HostSelector",
              "Ores.WasmLoaders.HttpsAssetUrl",
              "Ores.WasmLoaders.IslandName",
              "Ores.WasmLoaders.PrepareBudget",
              "Ores.WasmLoaders.PrepareStage",
              "Ores.WasmLoaders.RecordString",
              "Ores.WasmLoaders.RecordUnknown",
              "Ores.WasmLoaders.Release",
              "Ores.WasmLoaders.ReleaseId",
              "Ores.WasmLoaders.RuntimeKind",
              "Ores.WasmLoaders.SchemaVersion",
              "Ores.WasmLoaders.Sha256Hex",
              "Ores.WasmLoaders.ToolchainId"
            ]
          verification: .dioxus-evidence/tjsv/consumer-verification.json

      - name: Run generated-glue parser adversarial tests
        run: node --test pilot/real/dioxus-graph.test.mjs

      - name: Install exact Rust toolchain and target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          rustc +1.94.0 --version
          cargo +1.94.0 --version

      - name: Build exact upstream Dioxus split harness
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 rustc --locked \
            --manifest-path subject/dioxus/Cargo.toml \
            --package wasm-split-harness \
            --target wasm32-unknown-unknown \
            --profile wasm-split-release \
            -- -Clink-args=--emit-relocs
          test -s subject/dioxus/target/wasm32-unknown-unknown/wasm-split-release/wasm-split-harness.wasm
          cargo +1.94.0 build --locked \
            --manifest-path subject/dioxus/Cargo.toml \
            --package wasm-split-cli \
            --bin wasm-split-cli
          test -x subject/dioxus/target/debug/wasm-split-cli

      - name: Install matching wasm-bindgen binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cargo +1.94.0 metadata --locked --format-version=1 --manifest-path subject/dioxus/Cargo.toml | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version' | sort -u)"
          test -n "$VERSION"
          test "$(printf '%s\n' "$VERSION" | wc -l)" -eq 1
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$VERSION/wasm-bindgen-$VERSION-x86_64-unknown-linux-musl.tar.gz" \
            -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/wasm-bindgen"
          "$RUNNER_TEMP/wasm-bindgen/wasm-bindgen" --version | tee .dioxus-evidence/wasm-bindgen-version.txt
          printf '%s\n' "$VERSION" > .dioxus-evidence/wasm-bindgen-crate-version.txt
          sha256sum "$RUNNER_TEMP/wasm-bindgen.tar.gz" > .dioxus-evidence/wasm-bindgen.tar.gz.sha256

      - name: Emit real Dioxus split output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pilot/real/inputs/dioxus
          mkdir -p pilot/real/inputs/dioxus/bindgen pilot/real/inputs/dioxus/public
          "$RUNNER_TEMP/wasm-bindgen/wasm-bindgen" \
            subject/dioxus/target/wasm32-unknown-unknown/wasm-split-release/wasm-split-harness.wasm \
            --target web \
            --out-dir pilot/real/inputs/dioxus/bindgen \
            --out-name main \
            --no-demangle \
            --no-typescript \
            --keep-lld-exports \
            --keep-debug
          subject/dioxus/target/debug/wasm-split-cli split \
            subject/dioxus/target/wasm32-unknown-unknown/wasm-split-release/wasm-split-harness.wasm \
            pilot/real/inputs/dioxus/bindgen/main_bg.wasm \
            pilot/real/inputs/dioxus/public
          mv pilot/real/inputs/dioxus/public/main.wasm pilot/real/inputs/dioxus/public/main_bg.wasm
          cp pilot/real/inputs/dioxus/bindgen/main.js pilot/real/inputs/dioxus/public/main.js
          if test -d pilot/real/inputs/dioxus/bindgen/snippets; then
            cp -R pilot/real/inputs/dioxus/bindgen/snippets pilot/real/inputs/dioxus/public/snippets
          fi
          test -s pilot/real/inputs/dioxus/public/__wasm_split.js
          test "$(find pilot/real/inputs/dioxus/public -maxdepth 1 -type f -name 'module_*.wasm' | wc -l)" -ge 1

      - name: Derive route dependency graph only from generated Dioxus glue
        shell: bash
        run: |
          set -euo pipefail
          DIOXUS_SPLIT_GLUE=pilot/real/inputs/dioxus/public/__wasm_split.js \
            node pilot/real/dioxus-graph.mjs > pilot/real/inputs/dioxus/graph.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync('pilot/real/inputs/dioxus/graph.json', 'utf8'));
          assert.equal(graph.schema, 'ores-wasm-loaders.dioxus-split-graph/v1');
          assert.equal(graph.route, '/child');
          assert.equal(graph.noExecution, true);
          assert.match(graph.routeModule, /^module_\d+_routeChildSplit[0-9a-f]+\.wasm$/);
          assert.ok(graph.closure.length >= 1);
          NODE

      - name: Build exact OWLS manifest producer and candidate packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot/real/inputs/packages .dioxus-evidence/packages
          cargo +1.94.0 fmt --check --manifest-path subject/owls-web-loader/tools/manifest/Cargo.toml
          cargo +1.94.0 test --locked --manifest-path subject/owls-web-loader/tools/manifest/Cargo.toml \
            2>&1 | tee .dioxus-evidence/manifest-tests.log
          cargo +1.94.0 build --locked --release --manifest-path subject/owls-web-loader/tools/manifest/Cargo.toml
          (cd subject/owls-web-loader && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/.dioxus-evidence/packages") \
            > .dioxus-evidence/loader-pack.json
          (cd subject/owls-interfaces && npm pack --ignore-scripts --json --pack-destination "$GITHUB_WORKSPACE/.dioxus-evidence/packages") \
            > .dioxus-evidence/interfaces-pack.json
          OUT="$GITHUB_WORKSPACE/.dioxus-evidence/packages" node --input-type=module <<'NODE'
          import { copyFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const name of ['loader', 'interfaces']) {
            const metadata = JSON.parse(readFileSync(`.dioxus-evidence/${name}-pack.json`, 'utf8'))[0];
            if (metadata.size > 2 * 1024 * 1024) throw new Error(`${name} package unexpectedly exceeds 2 MiB`);
            copyFileSync(join(process.env.OUT, metadata.filename), `pilot/real/inputs/packages/${name}.tgz`);
          }
          NODE

      - name: Generate and admit real Dioxus release manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const graph = JSON.parse(readFileSync('pilot/real/inputs/dioxus/graph.json', 'utf8'));
          const recipe = {
            root: 'pilot/real/inputs/dioxus/public',
            base_url: 'https://127.0.0.1:4444/assets/dioxus/r1/',
            app_id: 'dioxus-pilot',
            release: 'r1',
            runtime: 'wasm-bindgen',
            framework: 'dioxus',
            entrypoint: 'main.js',
            routes: graph.routes,
            dependencies: graph.dependencies,
            toolchain: {
              dioxus: '0.7.9',
              dioxusSource: process.env.DIOXUS_REF,
              rust: '1.94.0',
            },
          };
          writeFileSync('pilot/real/inputs/dioxus/recipe.json', `${JSON.stringify(recipe, null, 2)}\n`);
          NODE
          subject/owls-web-loader/tools/manifest/target/release/owls-build-manifest \
            < pilot/real/inputs/dioxus/recipe.json \
            > pilot/real/inputs/dioxus/manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const interfaces = await import(pathToFileURL(`${process.cwd()}/subject/owls-interfaces/index.mjs`).href);
          const graph = JSON.parse(readFileSync('pilot/real/inputs/dioxus/graph.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('pilot/real/inputs/dioxus/manifest.json', 'utf8'));
          const release = interfaces.parseRelease(manifest, ['https://127.0.0.1:4444'], interfaces.releaseSchema);
          const closure = interfaces.dependencyClosureForRoute(release, '/child');
          assert.deepEqual(closure.map((asset) => new URL(asset.url).pathname.split('/').at(-1)), graph.closure);
          assert.ok(closure.every((asset) => asset.kind === 'wasm'));
          assert.equal(manifest.framework, 'dioxus');
          assert.equal(manifest.activation.mode, 'mount-route');
          NODE

      - name: Install pinned browser tooling and exercise fetch-only route preparation
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix pilot/real
          (cd pilot/real && npx playwright install --with-deps chromium firefox webkit)
          node pilot/real/dioxus-prefetch.mjs

      - name: Seal reproducibility and no-execution evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dioxus-evidence/build
          cp pilot/real/inputs/dioxus/graph.json .dioxus-evidence/build/graph.json
          cp pilot/real/inputs/dioxus/recipe.json .dioxus-evidence/build/recipe.json
          cp pilot/real/inputs/dioxus/manifest.json .dioxus-evidence/build/manifest.json
          cp pilot/real/inputs/dioxus/public/__wasm_split.js .dioxus-evidence/build/__wasm_split.js
          cp pilot/real/evidence/dioxus/browser-prefetch.json .dioxus-evidence/build/browser-prefetch.json
          {
            printf 'e2e=%s\n' "$(git rev-parse HEAD)"
            printf 'dioxus=%s\n' "$(git -C subject/dioxus rev-parse HEAD)"
            printf 'interfaces=%s\n' "$(git -C subject/owls-interfaces rev-parse HEAD)"
            printf 'web_loader=%s\n' "$(git -C subject/owls-web-loader rev-parse HEAD)"
            printf 'validator=%s\n' "$(git -C subject/typespec-json-schema-validator rev-parse HEAD)"
            printf 'rustc=%s\n' "$(rustc +1.94.0 --version)"
            printf 'cargo=%s\n' "$(cargo +1.94.0 --version)"
            printf 'node=%s\n' "$(node --version)"
          } > .dioxus-evidence/build/versions.txt
          sha256sum subject/dioxus/Cargo.lock > .dioxus-evidence/build/dioxus-Cargo.lock.sha256
          find pilot/real/inputs/dioxus/public -type f -print0 | sort -z | xargs -0 sha256sum > .dioxus-evidence/build/public-files.sha256
          sha256sum \
            .dioxus-evidence/tjsv/report.json \
            .dioxus-evidence/tjsv/contract-ir.json \
            .dioxus-evidence/tjsv/consumer-verification.json \
            .dioxus-evidence/build/graph.json \
            .dioxus-evidence/build/manifest.json \
            .dioxus-evidence/build/browser-prefetch.json \
            > .dioxus-evidence/build/evidence.sha256

      - name: Preserve real Dioxus acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-dioxus-route-split-${{ github.sha }}
          path: .dioxus-evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
