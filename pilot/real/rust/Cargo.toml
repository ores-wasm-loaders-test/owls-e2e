[package]
name = "owls-pilot-island"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "render"
path = "src/render.rs"
required-features = ["ssr"]

[dependencies]
leptos = { version = "=0.8.2", features = ["islands"] }
hydration_context = "0.3.0"
wasm-bindgen = "0.2.100"

[features]
default = []
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
