[package]
name = "owls-e2e-consumer"
version = "0.1.1"
edition = "2021"
publish = false
license = "MIT"
description = "External-consumer conformance tests for owls-runtime, driven by the shared release corpus"

# This crate is its own workspace root so that the [patch.crates-io] table below
# is the *consumer* root patch. A dependency's own patch table never applies to
# the consumer, which is why owls-runtime's internal patch table is not enough.
[workspace]

# Paths follow owls-docs/docs/installation.md, offset by one directory because
# zed_modules/ is installed at the repository root and this crate lives in rust/.
[dependencies]
owls-runtime = { path = "../zed_modules/ores-wasm-loaders/owls-runtime" }
serde_json = "1.0.140"
sha2 = "0.10.9"

[patch.crates-io]
owls-interfaces = { path = "../zed_modules/ores-wasm-loaders/owls-interfaces/rust" }
